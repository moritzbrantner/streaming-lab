name: Repair root Bun lockfile

on:
  push:
    branches: [chore/harden-validation]
    paths:
      - ".github/workflows/repair-root-lockfile.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/harden-validation
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Regenerate workspace lockfile
        run: |
          rm -f bun.lock
          bun install --lockfile-only
          bun install --frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate Bun workspace lockfile"
          git push origin HEAD:chore/harden-validation
